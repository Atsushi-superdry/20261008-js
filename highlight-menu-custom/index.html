<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DORO WORLD</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"
        integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</head>
<body>
    <div id="wrapper">
        <header>
            <h1>DORO WORLD</h1>
            <p>DORODORODORO!!!!!!!!</p>
            <nav>
                <ul>
                    <li class="current"><a href="#welcome">DORO!!!</a></li>
                    <li><a href="#gallery">Doros</a></li>
                    <li><a href="#motion">DoroDoro</a></li>
                    <li><a href="#gift">Doro?</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <!-- 元のJSに合わせ、sectionは4つにしています。 -->
            <section id="welcome">
                <h2>DORODORORO！</h2>
                <p>Doro。<br>dorodorodoro!!!</p>
                <img class="main-doro" src="images/doro.png" alt="まるくなったDoro">
            </section>

            <section id="gallery">
                <h2>Doro</h2>
                <p>doroDOroDorO</p>
                <div class="gallery">
                    <figure><img src="images/friends.jpg" alt="友達と手をつなぐDoro" loading="lazy"><figcaption>DoroDoro!</figcaption></figure>
                    <figure><img src="images/bed.gif" alt="布団から顔を出すDoro" loading="lazy"><figcaption>Doro...</figcaption></figure>
                    <figure><img src="images/hello.gif" alt="手をあげるDoro" loading="lazy"><figcaption>Doro！</figcaption></figure>
                    <figure><img src="images/mini.gif" alt="手で握られた小さなDoro" loading="lazy"><figcaption>dorororororo</figcaption></figure>
                </div>
            </section>

            <section id="motion">
                <h2>DoroDoro</h2>
                <p>Dorooooo!!!</p>
                <div class="gallery">
                    <figure><img src="images/run.gif" alt="走るDoro" loading="lazy"><figcaption>dorodorodorodoro</figcaption></figure>
                    <figure><img src="images/orange.gif" alt="オレンジを持つDoro" loading="lazy"><figcaption>orange love</figcaption></figure>
                    <figure><img src="images/color.gif" alt="カラフルに揺れるDoro" loading="lazy"><figcaption>Dorororo...</figcaption></figure>
                </div>
            </section>

            <section id="gift">
                <h2>gift for you</h2>
                <p>「Doro！」</p>
                <img class="gift-doro" src="images/gift.png" alt="プレゼントを差し出すDoro" loading="lazy">
            </section>
        </main>
    </div>
</body>
</html>
